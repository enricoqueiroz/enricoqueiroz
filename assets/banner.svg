<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Enrico Queiroz, Engenharia de Computação. Datasheet do perfil, revisão 2026." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .draw { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.6s ease-out forwards; }
    .pin { opacity: 0; animation: fade .6s ease-out forwards; animation-delay: 2s; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes scan { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .5; } 90% { opacity: .5; } 100% { transform: translateX(1100px); opacity: 0; } }
  </style>

  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1C1C1C" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#2B2B2B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- fundo e grade -->
  <rect width="1200" height="360" fill="#0D0D0D"/>
  <rect width="1200" height="360" fill="url(#major)"/>

  <!-- linha de varredura -->
  <rect class="scan" x="40" y="16" width="2" height="328" fill="#FFD400"/>

  <!-- moldura -->
  <rect x="16" y="16" width="1168" height="328" fill="none" stroke="#FFD400" stroke-width="1.5"/>
  <path d="M16 46V16H46M1154 16H1184V46M1184 314V344H1154M46 344H16V314" fill="none" stroke="#FFD400" stroke-width="5"/>

  <!-- texto principal -->
  <text x="60" y="78" font-size="14" letter-spacing="5" fill="#FFD400">DATASHEET · REV. 2026</text>
  <text x="56" y="160" font-size="76" font-weight="700" fill="#FFFFFF">ENRICO</text>
  <text x="56" y="232" font-size="76" font-weight="700" fill="#FFD400">QUEIROZ<tspan class="blink" fill="#FFFFFF">_</tspan></text>
  <text x="60" y="292" font-size="18" letter-spacing="3" fill="#FFFFFF">ENGENHARIA DE COMPUTAÇÃO</text>

  <!-- linhas de centro do componente -->
  <path d="M820 120H1100M960 24V230" stroke="#FFD400" stroke-opacity=".35" stroke-width="1" stroke-dasharray="10 4 2 4" fill="none"/>

  <!-- chip desenhado -->
  <rect class="draw" x="900" y="60" width="120" height="120" fill="#0D0D0D" stroke="#FFD400" stroke-width="2.5"/>
  <g class="pin" stroke="#FFD400" stroke-width="2.5">
    <path d="M915 42V60M945 42V60M975 42V60M1005 42V60"/>
    <path d="M915 180V198M945 180V198M975 180V198M1005 180V198"/>
    <path d="M882 75H900M882 105H900M882 135H900M882 165H900"/>
    <path d="M1020 75H1038M1020 105H1038M1020 135H1038M1020 165H1038"/>
  </g>
  <g class="pin">
    <circle cx="912" cy="72" r="3.5" fill="#FFD400"/>
    <text x="960" y="132" font-size="38" font-weight="700" fill="#FFD400" text-anchor="middle">EQ</text>
    <text x="960" y="156" font-size="10" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">C · ARDUINO</text>
  </g>

  <!-- legenda de cotas -->
  <g class="pin" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1" fill="none">
    <path d="M900 222H1020M900 216V228M1020 216V228"/>
  </g>
  <text class="pin" x="960" y="240" font-size="11" letter-spacing="2" fill="#FFFFFF" fill-opacity=".7" text-anchor="middle">SOFTWARE + HARDWARE</text>

  <!-- bloco de legenda (title block) -->
  <g>
    <rect x="640" y="268" width="520" height="56" fill="#0D0D0D" stroke="#FFD400" stroke-width="1.5"/>
    <path d="M770 268V324M900 268V324M1030 268V324" stroke="#FFD400" stroke-width="1"/>

    <text x="652" y="284" font-size="9" letter-spacing="2" fill="#8B949E">PROJETO</text>
    <text x="652" y="310" font-size="13" font-weight="700" fill="#FFFFFF">PERFIL GITHUB</text>

    <text x="782" y="284" font-size="9" letter-spacing="2" fill="#8B949E">LOCAL</text>
    <text x="782" y="310" font-size="13" font-weight="700" fill="#FFFFFF">PIRACICABA, SP</text>

    <text x="912" y="284" font-size="9" letter-spacing="2" fill="#8B949E">REVISÃO</text>
    <text x="912" y="310" font-size="13" font-weight="700" fill="#FFFFFF">2026</text>

    <text x="1042" y="284" font-size="9" letter-spacing="2" fill="#8B949E">ESTÁGIO</text>
    <circle class="blink" cx="1048" cy="306" r="4" fill="#FFD400"/>
    <text x="1058" y="310" font-size="11" font-weight="700" fill="#FFD400">QUARK MEDICAL</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
